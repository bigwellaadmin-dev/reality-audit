# CodeQL static analysis.
#
# The repo is mostly markdown, but tool/index.html contains the full
# interactive walk-through as inlined JavaScript. CodeQL extracts JS from
# HTML automatically, so this catches the realistic surface area: any
# regression that introduces an XSS sink (innerHTML, document.write, etc.)
# into the tool.
#
# Findings appear under Security -> Code scanning. The default
# security-and-quality query suite is conservative — it does not block
# merges on its own, but it generates SARIF the Scorecard run can credit.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '13 4 * * 2'   # Tuesdays 04:13 UTC

permissions: read-all

jobs:
  analyze:
    name: Analyze JavaScript
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialise CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Analyse
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:${{ matrix.language }}"
