# CodeQL static analysis.
#
# The repo is mostly markdown, but tool/index.html contains the full
# interactive walk-through as inlined JavaScript. CodeQL extracts JS from
# HTML automatically, so this catches the realistic surface area: any
# regression that introduces an XSS sink (innerHTML, document.write, etc.)
# into the tool.
#
# Findings appear under Security -> Code scanning. The default
# security-and-quality query suite is conservative — it does not block
# merges on its own, but it generates SARIF the Scorecard run can credit.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '13 4 * * 2'   # Tuesdays 04:13 UTC

permissions: read-all

jobs:
  analyze:
    name: Analyze JavaScript
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Initialise CodeQL
        uses: github/codeql-action/init@4e828ff8d448a8a6e532957b1811f387a63867e8 # v3.29.4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Analyse
        uses: github/codeql-action/analyze@4e828ff8d448a8a6e532957b1811f387a63867e8 # v3.29.4
        with:
          category: "/language:${{ matrix.language }}"
