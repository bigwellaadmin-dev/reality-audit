# OpenSSF Scorecard.
#
# Scores this repo against ~20 supply-chain security best practices
# (branch protection, signed releases, pinned dependencies, token
# permissions, code review, vulnerability patching, etc.) and posts the
# results to the Security tab as SARIF.
#
# The Scorecard badge in README.md reads its data from this run.
#
# Runs weekly so the badge stays current, and on every push to main so
# a regression is caught as it lands.
#
# Reference: https://github.com/ossf/scorecard

name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '32 7 * * 1'  # Mondays 07:32 UTC
  push:
    branches: [main]
  workflow_dispatch:

# Top-level perms are minimal; the analysis job opts into the extras it needs.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Upload SARIF to the Security tab.
      security-events: write
      # Read repo content + write the run ID badge.
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Allow the action to publish results to the OpenSSF API so the
          # README badge has data to render. If you would rather keep
          # results private, set this to false and remove the badge.
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to Security tab
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
